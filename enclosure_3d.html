<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Counter Monitor — 3D Enclosure (side-firing sub + PR, rear electronics)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1116; color: #cfd8e3;
    font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  .panel { background: rgba(16,20,27,.82); border: 1px solid #2c3a48; border-radius: 10px;
    backdrop-filter: blur(6px); }
  #hud { position: fixed; top: 14px; left: 16px; max-width: 380px; padding: 14px 16px; }
  #hud h1 { font-size: 15px; margin: 0 0 6px; color: #fff; }
  #hud .dim { font-size: 12px; color: #8ea3b8; margin: 0 0 10px; }
  #hud table { font-size: 12px; border-collapse: collapse; width: 100%; }
  #hud td { padding: 2px 6px 2px 0; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px;
    margin-right: 6px; vertical-align: middle; }
  #hud .face { color: #6f8298; }
  #controls { position: fixed; bottom: 14px; left: 16px; font-size: 12px;
    color: #6f8298; padding: 8px 12px; }
  #controls .hint { display:block; margin-bottom: 7px; }
  button { background: #243140; color: #cfd8e3; border: 1px solid #38495b;
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; margin: 0 4px 4px 0; }
  button:hover { background: #2e3e50; }
  button.on { background: #3a5f8a; border-color: #5b86b8; color: #fff; }
  .grp { display:inline-block; margin-right: 10px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud" class="panel">
  <h1>Kitchen Counter Monitor</h1>
  <p class="dim">220 W &times; 180 D &times; 360 H mm &nbsp;•&nbsp; side-firing sub + PR · rear electronics</p>
  <table>
    <tr><td><span class="sw" style="background:#c8553d"></span>Sub W5-1138SMF</td><td class="face">left side · &empty;155</td></tr>
    <tr><td><span class="sw" style="background:#588b8b"></span>Mid DS115-8</td><td class="face">front · &empty;115.6</td></tr>
    <tr><td><span class="sw" style="background:#dca94b"></span>Tweeter R2604</td><td class="face">front · &empty;104</td></tr>
    <tr><td><span class="sw" style="background:#7a6fb0"></span>PR SB15SFCR-00</td><td class="face">right side · 169&times;253</td></tr>
    <tr><td><span class="sw" style="background:#3d6098"></span>Electronics pocket</td><td class="face">rear · 175&times;127&times;46</td></tr>
  </table>
</div>
<div id="controls" class="panel">
  <span class="hint">Drag to orbit · scroll to zoom</span>
  <span class="grp">
    <button id="btnFront">Front</button>
    <button id="btnLeft">Sub side</button>
    <button id="btnRight">PR side</button>
    <button id="btnRear">Rear</button>
    <button id="btnIso">Iso</button>
  </span>
  <span class="grp">
    <button id="btnCut">Cutaway</button>
    <button id="btnWire">Wireframe</button>
    <button id="btnSpin">Auto-rotate</button>
    <button id="btnGrid" class="on">Grid</button>
  </span>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- enclosure dimensions (mm; 1mm = 1 unit) ----
const W = 220, D = 180, H = 360;          // external; locked
const FRONT = D, REAR = 0, LEFT = 0, RIGHT = W;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1116);
scene.fog = new THREE.Fog(0x0e1116, 1400, 2600);

const app = document.getElementById('app');
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 1, 6000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 250;
controls.maxDistance = 2200;

// ---- lighting ----
scene.add(new THREE.HemisphereLight(0xb9d2ff, 0x1a1f26, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(360, 620, 540);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 100; key.shadow.camera.far = 2200;
key.shadow.camera.left = -500; key.shadow.camera.right = 500;
key.shadow.camera.top = 500; key.shadow.camera.bottom = -500;
key.shadow.bias = -0.0004;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6f9bff, 0.7); rim.position.set(-420, 260, -360); scene.add(rim);

// ---- root group centred on origin ----
const root = new THREE.Group();
root.position.set(-W/2, -H/2, -D/2);
scene.add(root);

// ---- ground + grid ----
const groundY = -H/2 - 1;
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(4000, 4000),
  new THREE.MeshStandardMaterial({ color: 0x12161c, roughness: 1 }));
ground.rotation.x = -Math.PI/2; ground.position.y = groundY; ground.receiveShadow = true;
scene.add(ground);
const grid = new THREE.GridHelper(2400, 48, 0x2c3a48, 0x1c242e);
grid.position.y = groundY + 0.2; scene.add(grid);

// ---- cabinet ----
const cabMat = new THREE.MeshStandardMaterial({ color: 0x6b5640, roughness: 0.78, side: THREE.DoubleSide, transparent: true, opacity: 1 });
const toggleMats = [], wireMeshes = [];
const cab = new THREE.Mesh(new THREE.BoxGeometry(W, H, D), cabMat);
cab.position.set(W/2, H/2, D/2); cab.castShadow = true; cab.receiveShadow = true;
root.add(cab); toggleMats.push(cabMat); wireMeshes.push(cab);
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(W, H, D)),
  new THREE.LineBasicMaterial({ color: 0x9fb4c9 }));
edges.position.set(W/2, H/2, D/2); root.add(edges);

// ============ generic driver built in LOCAL space ============
// Baffle plane at local z=0; cone protrudes +z (outward); basket protrudes -z (into box).
function makeDriver(odMM, cutoutMM, color, proud, into) {
  const g = new THREE.Group();
  const rOuter = odMM/2, rCut = cutoutMM/2;

  const ring = new THREE.Mesh(new THREE.RingGeometry(rCut, rOuter, 64),
    new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.25, side: THREE.DoubleSide }));
  ring.position.z = 0.6; ring.castShadow = true;
  g.add(ring); wireMeshes.push(ring);

  const cone = new THREE.Mesh(new THREE.ConeGeometry(rCut, proud, 64, 1, true),
    new THREE.MeshStandardMaterial({ color, roughness: 0.42, metalness: 0.12, side: THREE.DoubleSide }));
  cone.rotation.x = -Math.PI/2; cone.position.z = proud/2; cone.castShadow = true;  // wide base at z=0, apex +z
  g.add(cone); wireMeshes.push(cone);

  const cap = new THREE.Mesh(new THREE.SphereGeometry(rCut*0.32, 32, 20, 0, Math.PI*2, 0, Math.PI/2),
    new THREE.MeshStandardMaterial({ color: 0x14181d, roughness: 0.32, metalness: 0.3 }));
  cap.rotation.x = Math.PI/2; cap.position.z = proud + 1;
  g.add(cap); wireMeshes.push(cap);

  if (into > 0) {
    const baskMat = new THREE.MeshStandardMaterial({ color: 0x23282f, roughness: 0.85, side: THREE.DoubleSide, transparent: true, opacity: 1 });
    const bask = new THREE.Mesh(new THREE.CylinderGeometry(rCut*0.55, rCut*0.92, into, 32, 1, true), baskMat);
    bask.rotation.x = Math.PI/2; bask.position.z = -into/2;
    g.add(bask); wireMeshes.push(bask); toggleMats.push(baskMat);
  }
  return g;
}

// ============ racetrack PR built in LOCAL space ============
function makeRacetrack(wMM, hMM, color, proud) {
  const g = new THREE.Group();
  const r = wMM/2, straight = hMM - wMM, hs = straight/2, hw = wMM/2;
  const shape = new THREE.Shape();
  shape.moveTo(-hw, -hs); shape.lineTo(-hw, hs);
  shape.absarc(0, hs, r, Math.PI, 0, true);
  shape.lineTo(hw, -hs);
  shape.absarc(0, -hs, r, 0, Math.PI, true);

  const body = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: proud, bevelEnabled: false }),
    new THREE.MeshStandardMaterial({ color, roughness: 0.5, metalness: 0.18 }));
  body.castShadow = true; g.add(body); wireMeshes.push(body);

  const plate = new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshStandardMaterial({ color: 0x6258a0, roughness: 0.6, metalness: 0.2, side: THREE.DoubleSide }));
  plate.position.z = proud + 0.5; g.add(plate); wireMeshes.push(plate);
  return g;
}

// ============ place a local-space part on a named face ============
// front/rear: (a,b) = (x,y).  left/right: (a,b) = (y,z).
function place(g, face, a, b) {
  if (face === 'front') { g.position.set(a, b, FRONT); }
  else if (face === 'rear')  { g.position.set(a, b, REAR);  g.rotation.y = Math.PI; }
  else if (face === 'left')  { g.position.set(LEFT,  a, b); g.rotation.y = -Math.PI/2; }
  else if (face === 'right') { g.position.set(RIGHT, a, b); g.rotation.y =  Math.PI/2; }
  root.add(g);
  return g;
}

// ============ electronics pocket (recess into box from rear) ============
function rearPocket(cx, cy, wMM, hMM, depthMM) {
  const boxMat = new THREE.MeshStandardMaterial({ color: 0x3d6098, roughness: 0.75, metalness: 0.1, transparent:true, opacity:0.85 });
  const box = new THREE.Mesh(new THREE.BoxGeometry(wMM, hMM, depthMM), boxMat);
  box.position.set(cx, cy, REAR + depthMM/2);
  root.add(box); wireMeshes.push(box); toggleMats.push(boxMat);
  const out = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(wMM, hMM, depthMM)),
    new THREE.LineBasicMaterial({ color: 0x9fc0ee }));
  out.position.copy(box.position); root.add(out);
  const holeMat = new THREE.MeshStandardMaterial({ color: 0x0a0d11, roughness: 0.9 });
  const cols = 6, rows = 4, sx = wMM*0.62/(cols-1), sy = hMM*0.5/(rows-1);
  for (let i=0;i<cols;i++) for (let j=0;j<rows;j++) {
    const h = new THREE.Mesh(new THREE.CircleGeometry(3.5, 18), holeMat);
    h.position.set(cx - wMM*0.31 + i*sx, cy - hMM*0.25 + j*sy, REAR - 0.5);
    h.rotation.y = Math.PI; root.add(h);
  }
}

// ============ build the system ============
place(makeDriver(155, 120, 0xc8553d, 14, 60), 'left',  130, 90);   // SUB  — left side (y=130, z=90)
place(makeRacetrack(168.75, 253, 0x7a6fb0, 16), 'right', 150, 90); // PR   — right side (y=150, z=90)
place(makeDriver(115.6, 93.6, 0x588b8b, 10, 36), 'front', 110, 150); // MID — front column
place(makeDriver(104, 74, 0xdca94b, 9, 30), 'front', 110, 265);      // TWEETER — above mid
rearPocket(110, 180, 175, 127, 46);                                  // electronics — rear

// soil-pipe mid rear chamber (internal cylinder behind the mid)
const pipeMat = new THREE.MeshStandardMaterial({ color: 0x4a525c, roughness: 0.9, transparent:true, opacity:0.5, side: THREE.DoubleSide });
const pipe = new THREE.Mesh(new THREE.CylinderGeometry(55, 55, 70, 40, 1, true), pipeMat);
pipe.rotation.x = Math.PI/2; pipe.position.set(110, 150, FRONT - 35 - 18);
root.add(pipe); toggleMats.push(pipeMat);

// ============ camera presets ============
const target = new THREE.Vector3(0, 0, 0);
function view(px, py, pz){ camera.position.set(px,py,pz); controls.target.copy(target); controls.update(); }
function isoView(){ view(480, 330, 600); }
isoView();
document.getElementById('btnFront').onclick = ()=> view(0, 30, 700);
document.getElementById('btnRear').onclick  = ()=> view(0, 30, -700);
document.getElementById('btnLeft').onclick  = ()=> view(-700, 30, 0);
document.getElementById('btnRight').onclick = ()=> view(700, 30, 0);
document.getElementById('btnIso').onclick   = isoView;

// ============ toggles ============
let cut=false, wire=false, spin=false, gridOn=true;
const $ = id => document.getElementById(id);
$('btnCut').onclick = ()=>{ cut=!cut; $('btnCut').classList.toggle('on',cut);
  cabMat.opacity = cut?0.12:1.0; cabMat.depthWrite = !cut; edges.material.color.set(cut?0x6f8298:0x9fb4c9); };
$('btnWire').onclick = ()=>{ wire=!wire; $('btnWire').classList.toggle('on',wire);
  wireMeshes.forEach(m=>{ if(m.material) m.material.wireframe=wire; }); };
$('btnSpin').onclick = ()=>{ spin=!spin; $('btnSpin').classList.toggle('on',spin);
  controls.autoRotate=spin; controls.autoRotateSpeed=1.2; };
$('btnGrid').onclick = ()=>{ gridOn=!gridOn; $('btnGrid').classList.toggle('on',gridOn);
  grid.visible=gridOn; ground.visible=gridOn; };

addEventListener('resize', ()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); });

(function loop(){ requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
</script>
</body>
</html>
